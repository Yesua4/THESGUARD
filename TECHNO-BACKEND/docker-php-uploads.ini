; php:8.2-cli-bookworm ships with no active php.ini at all, so PHP falls
; back to its hardcoded historical defaults -- upload_max_filesize=2M in
; particular, which silently rejects any document upload over 2MB before
; Laravel's own 20MB (max:20480) validation in DocumentController ever
; runs. This raises the PHP-level ceiling above that app-level limit.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
